<header class="border-b border-line bg-surface">
  <div
    class="mx-auto flex w-full max-w-content flex-col items-start gap-3 px-4 py-4 sm:min-h-18 sm:flex-row sm:items-center sm:justify-between sm:gap-6 sm:px-5 sm:py-0"
  >
    <a
      class="inline-flex items-center gap-2.5 whitespace-nowrap font-bold text-ink no-underline"
      routerLink="/"
    >
      <span class="grid size-8 place-items-center rounded-control bg-brand text-sm text-white"
        >M</span
      >
      <span>Market Simulator</span>
    </a>

    <nav class="flex items-center gap-1 text-muted">
      <a
        class="rounded-control px-3.5 py-2.5 font-semibold no-underline hover:bg-brand-soft hover:text-brand-strong"
        routerLink="/"
        routerLinkActive="bg-brand-soft text-brand-strong"
        [routerLinkActiveOptions]="{ exact: true }"
        >Dashboard</a
      >
      <a
        class="rounded-control px-3.5 py-2.5 font-semibold no-underline hover:bg-brand-soft hover:text-brand-strong"
        routerLink="/settings"
        routerLinkActive="bg-brand-soft text-brand-strong"
        >Settings</a
      >
    </nav>
  </div>
</header>
