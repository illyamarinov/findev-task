<section>
  <div class="mb-7 flex flex-col items-start gap-5 lg:flex-row lg:items-end lg:justify-between">
    <div>
      <p class="mb-2 text-xs font-extrabold tracking-widest text-brand-strong uppercase">
        Live market
      </p>
      <h1 class="mb-2 text-page-title font-bold tracking-[-0.04em]">Dashboard</h1>
      <p class="text-muted">Trade and order-book metrics for simulated instruments.</p>
    </div>

    <app-producer-controls [status]="producer.status()" (toggleRequested)="toggleGeneration()" />
  </div>

  @if (producer.error(); as error) {
    <p
      class="mb-5 rounded-control border border-danger-border bg-danger-soft px-4 py-3 text-danger"
    >
      Producer error: {{ error }}. Check Settings to start a new run.
    </p>
  }

  <app-metrics-table [metrics]="producer.metrics()" />
</section>
